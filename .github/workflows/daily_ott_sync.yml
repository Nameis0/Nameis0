name: Daily Telugu OTT Sync

on:
  schedule:
    # Daily run at 01:30 AM UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  sync-ott:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Auto OTT Sync Script
        run: |
          python auto_ott_sync.py
