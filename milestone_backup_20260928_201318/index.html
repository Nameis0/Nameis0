<!DOCTYPE html>
<html lang="te">
<head>

<!-- Firebase App & Auth SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - WatchTeluguOTT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #07090e; color: #fff; padding: 15px; }
    .header { font-size: 18px; font-weight: 800; color: #ffd700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .card { background: #121520; border: 1px solid #1f2538; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    label { font-size: 12px; color: #8c93a8; display: block; margin-top: 10px; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; background: #181c2b; border: 1px solid #283049; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #ffd700; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 14px; }
    .btn-primary { background: #ff2d55; color: #fff; }
    .btn-search { width: auto; padding: 0 16px; background: #ffd700; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; margin-top: 12px; cursor: pointer; font-size: 12px; }
    .checkbox-wrap input { width: 18px; height: 18px; }
    .search-box-wrap { display: flex; gap: 8px; margin-top: 4px; }
    #playerBox { display: none; margin-top: 12px; background: #000; border: 1px solid #ffd700; border-radius: 8px; padding: 10px; }
    #ytResults { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .yt-item { display: flex; align-items: center; gap: 10px; background: #181c2b; padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid #283049; }
    .yt-item:hover { border-color: #ffd700; }
    .yt-item img { width: 75px; height: 45px; border-radius: 4px; object-fit: cover; }
    .yt-item-title { font-size: 12px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .yt-item-sub { font-size: 10px; color: #8c93a8; }
    
    /* Content Item Card Styles */
    .list-item { background: #121520; border: 1px solid #1f2538; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
    .list-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .list-title { font-weight: bold; font-size: 13px; color: #fff; line-height: 1.3; }
    .list-meta { font-size: 11px; color: #8c93a8; margin-top: 2px; }
    .badge-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid #283049; background: #181c2b; color: #8c93a8; }
    .badge-btn.active-hero { background: #4a3800; border-color: #ffd700; color: #ffd700; }
    .badge-btn.active-week { background: #003a18; border-color: #00e676; color: #00e676; }
    .actions-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid #1c2236; }
    .date-input-mini { width: 110px; padding: 4px 6px; font-size: 11px; background: #181c2b; border: 1px solid #283049; border-radius: 4px; color: #fff; }
  </style>
</head>
<body>

<div id="adminAuthBox" style="background:#0f172a; padding:20px; border-radius:10px; margin:20px auto; max-width:500px; border:1px solid #334155; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
    <h3 style="margin-top:0; color:#38bdf8;">🔐 Admin Authentication</h3>
    <div style="display:flex; flex-direction:column; gap:12px;">
        <input type="password" id="adminPassInput" placeholder="Enter Admin Password" style="padding:12px; border-radius:6px; border:1px solid #475569; background:#1e293b; color:white; font-size:16px; text-align:center;">
        <button type="button" id="loginBtn" onclick="loginAdminUser()" style="padding:12px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">Unlock Admin Panel</button>
        <button type="button" id="logoutBtn" onclick="logoutAdminUser()" style="display:none; padding:8px 16px; background:#ef4444; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Logout</button>
    </div>
    <div id="authStatusText" style="font-size:13px; color:#94a3b8; margin-top:12px;">Checking security credentials...</div>
</div>

<div id="adminMainPanelWrapper" style="display:none;">


  <div class="header">⚡ WatchTeluguOTT Content Admin</div>

  <div class="card">
    
<!-- TMDB 1-Click Auto Fetch -->
<div style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #3b82f6;">
    <h3 style="margin-top:0; color:#60a5fa;">⚡ 1-Click "Where to Watch" Auto Fetch</h3>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="tmdbMovieQuery" placeholder="Movie Name (e.g. Devara, Kalki 2898 AD)" style="flex:1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
        <button type="button" onclick="fetchTMDBData()" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Auto Fetch</button>
    </div>
    <div id="fetchStatus" style="font-size: 13px; color: #94a3b8; margin-top: 8px;"></div>
</div>



<script>
// Check login state
function initAuthListener() {
    if (typeof firebase === "undefined" || !firebase.auth) {
        setTimeout(initAuthListener, 200);
        return;
    }

    firebase.auth().onAuthStateChanged((user) => {
        const status = document.getElementById("authStatusText");
        const wrapper = document.getElementById("adminMainPanelWrapper");
        const authBox = document.getElementById("adminAuthBox");

        if (user && user.email === "k.vishnu27492@gmail.com") {
            if (status) status.innerHTML = "<span style="color:#34d399;">✔ Access Granted!</span>";
            if (authBox) authBox.style.display = "none";
            if (wrapper) wrapper.style.display = "block";
        } else {
            if (status) status.innerHTML = "<span style="color:#94a3b8;">Enter password to unlock.</span>";
            if (authBox) authBox.style.display = "block";
            if (wrapper) wrapper.style.display = "none";
        }
    });
}
initAuthListener();

async function loginAdminUser() {
    const passInput = document.getElementById("adminPassInput");
    const status = document.getElementById("authStatusText");
    const pass = passInput ? passInput.value.trim() : "";

    if (!pass) {
        alert("Please enter password");
        return;
    }

    if (status) status.innerText = "Verifying password with Firebase...";

    try {
        await firebase.auth().signInWithEmailAndPassword("k.vishnu27492@gmail.com", pass);
        alert("Login Successful! Admin Panel Unlocked.");
    } catch(err) {
        console.error(err);
        if (status) status.innerHTML = "<span style="color:#f87171;">❌ " + err.message + "</span>";
        alert("Login Failed: " + err.message);
    }
}
</script>


</body>
</html>
